<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Arraiá da Cidade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .bg-creme { background-color: #FEF9D7; }
        body { overflow-x: hidden; }
        #fogueira {
          position: fixed;
          top: 0;
          left: 0;
          width: 88px;
          height: 120px;
          pointer-events: none;
          z-index: 9999;
          transform: translate(-50%, -100%);
          opacity: 0.95;
          transition: opacity 0.25s ease;
        }
        #fogueira img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          display: block;
          pointer-events: none;
        }
        .fogo {
          position: absolute;
          bottom: 0;
          left: 50%;
          transform-origin: bottom center;
          background: radial-gradient(circle at 50% 20%, #fff5b3 0%, #ffec6a 15%, #ff8a00 45%, #e32b2b 75%, transparent 100%);
          border-radius: 50% 50% 45% 45% / 70% 70% 30% 30%;
          filter: drop-shadow(0 0 12px rgba(255, 140, 0, 0.55));
          animation: fogo-pulsar 0.95s infinite ease-in-out;
        }
        .fogo::before {
          content: '';
          position: absolute;
          inset: 16% 22% 32% 22%;
          border-radius: 50%;
          background: radial-gradient(circle at center, rgba(255, 255, 255, 0.95), rgba(255, 230, 120, 0.2) 50%, transparent 100%);
        }
        .fogo:nth-child(1) {
          width: 24px;
          height: 60px;
          left: 40%;
          animation-duration: 0.9s;
        }
        .fogo:nth-child(2) {
          width: 32px;
          height: 80px;
          left: 10%;
          animation-duration: 1.05s;
          animation-delay: -0.2s;
        }
        .fogo:nth-child(3) {
          width: 20px;
          height: 48px;
          left: 70%;
          animation-duration: 0.8s;
          animation-delay: -0.35s;
        }
        @keyframes fogo-pulsar {
          0%, 100% { transform: translateX(0) scale(1) skewX(0); opacity: 0.92; }
          50% { transform: translateX(4px) scale(1.07) skewX(-5deg); opacity: 1; }
        }
    </style>
</head>
<body class="bg-creme text-gray-800 min-h-screen">

    <header class="bg-[#E30613] text-white py-4 px-6 md:px-20 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-2">
            <span class="text-xl">🎉</span>
            <h1 class="text-xl md:text-2xl font-black uppercase tracking-tighter">Arraiá da Cidade</h1>
        </div>
        <a href="index.html" class="text-sm font-bold hover:underline">← Voltar</a>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10 md:py-16">
        <h2 class="text-3xl md:text-5xl font-black text-[#B20000] mb-8 text-center md:text-left">Finalizar seu Ingresso</h2>
        
        <div class="grid lg:grid-cols-3 gap-10">
            
            <div class="lg:col-span-2 space-y-8">
                
                <div class="bg-white p-8 rounded-[30px] shadow-xl border border-gray-100">
                    <h3 class="text-xl font-black text-[#E30613] mb-6 flex items-center gap-2">
                        <span class="bg-red-100 p-2 rounded-lg text-sm">01</span> Dados do Comprador
                    </h3>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="text-sm font-bold text-gray-600">Nome Completo</label>
                            <input type="text" placeholder="Como no documento" class="border-2 border-gray-100 p-3 rounded-xl focus:border-[#FF8000] outline-none transition">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-sm font-bold text-gray-600">E-mail para envio</label>
                            <input type="email" placeholder="seu@email.com" class="border-2 border-gray-100 p-3 rounded-xl focus:border-[#FF8000] outline-none transition">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-sm font-bold text-gray-600">CPF</label>
                            <input type="text" placeholder="000.000.000-00" class="border-2 border-gray-100 p-3 rounded-xl focus:border-[#FF8000] outline-none transition">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-sm font-bold text-gray-600">Celular</label>
                            <input type="text" placeholder="(00) 90000-0000" class="border-2 border-gray-100 p-3 rounded-xl focus:border-[#FF8000] outline-none transition">
                        </div>
                    </div>
                </div>

                <div class="bg-white p-8 rounded-[30px] shadow-xl border border-gray-100">
                    <h3 class="text-xl font-black text-[#E30613] mb-6 flex items-center gap-2">
                        <span class="bg-red-100 p-2 rounded-lg text-sm">02</span> Forma de Pagamento
                    </h3>
                    <div class="grid grid-cols-2 md:grid-cols-2 gap-4 mb-6">
                        <button id="pix-btn" type="button" data-method="pix" class="payment-method-btn border-2 border-[#FF8000] bg-orange-50 p-4 rounded-2xl flex flex-col items-center gap-2">
                            <span class="text-2xl">⚡</span>
                            <span class="font-bold text-sm">Pix</span>
                        </button>
                        <button id="card-btn" type="button" data-method="cartao" class="payment-method-btn border-2 border-gray-100 p-4 rounded-2xl flex flex-col items-center gap-2 hover:border-[#FF8000] transition">
                            <span class="text-2xl">💳</span>
                            <span class="font-bold text-sm">Cartão</span>
                        </button>
                    </div>
                    
                    <div id="pix-key" class="rounded-2xl border border-dashed border-gray-300 bg-gray-50 p-4 text-sm text-gray-700 hidden">
                        Chave PIX: <span id="pix-key-value" class="font-black"></span>
                    </div>
                    <div id="card-details" class="space-y-4 hidden">
                        <div class="flex flex-col gap-1">
                            <label class="text-sm font-bold text-gray-600">Número do Cartão</label>
                            <input type="text" placeholder="0000 0000 0000 0000" class="border-2 border-gray-100 p-3 rounded-xl outline-none">
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1 flex items-start">
                <div class="w-full bg-white p-10 rounded-[30px] shadow-2xl border border-gray-100 text-center">
                    <h3 class="text-2xl font-black text-[#B20000] mb-6">Confirmar Pedido</h3>
                    <p class="text-gray-600 mb-8 leading-relaxed">Clique no botão abaixo para finalizar sua compra.</p>
                    <button class="w-full bg-[#E30613] text-white py-5 rounded-2xl font-black text-xl shadow-lg hover:bg-red-700 transition">
                        CONFIRMAR PEDIDO
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-10 text-gray-400 text-sm italic">
        Arraiá da Cidade 2026 - Onde a tradição se encontra com a diversão!
    </footer>

    <div id="fogueira">
      <img src="assets/images/fogo.png" alt="Fogo animado" />
    </div>

    <script>
        const paymentButtons = document.querySelectorAll('.payment-method-btn');
        const cardDetails = document.getElementById('card-details');
        const pixKeyBox = document.getElementById('pix-key');
        const pixKeyValue = document.getElementById('pix-key-value');

        function gerarChavePix() {
            const tipos = [
                () => `${Math.floor(Math.random() * 90000000000) + 10000000000}@pix`,
                () => `99999999999`,
                () => `00${Math.floor(Math.random() * 900000000) + 100000000}`,
                () => `user${Math.floor(Math.random() * 9000) + 1000}@banco.com`,
                () => `${Math.random().toString(36).substring(2, 10)}@pix`
            ];
            const escolha = tipos[Math.floor(Math.random() * tipos.length)];
            return escolha();
        }

        paymentButtons.forEach(button => {
            button.addEventListener('click', () => {
                paymentButtons.forEach(btn => {
                    btn.classList.remove('border-[#FF8000]', 'bg-orange-50');
                    btn.classList.add('border-gray-100');
                });

                button.classList.add('border-[#FF8000]', 'bg-orange-50');
                button.classList.remove('border-gray-100');

                const method = button.dataset.method;
                if (method === 'cartao') {
                    cardDetails.classList.remove('hidden');
                    pixKeyBox.classList.add('hidden');
                } else {
                    cardDetails.classList.add('hidden');
                    if (method === 'pix') {
                        pixKeyValue.textContent = gerarChavePix();
                        pixKeyBox.classList.remove('hidden');
                    } else {
                        pixKeyBox.classList.add('hidden');
                    }
                }
            });
        });

        const fogueira = document.getElementById('fogueira');
        let alvoX = window.innerWidth / 2;
        let alvoY = window.innerHeight / 2;
        let posX = alvoX;
        let posY = alvoY;

        document.addEventListener('pointermove', event => {
          alvoX = event.clientX;
          alvoY = event.clientY;
          fogueira.style.opacity = '0.98';
        });

        document.addEventListener('pointerleave', () => {
          fogueira.style.opacity = '0.3';
        });

        function moverFogueira() {
          posX += (alvoX - posX) * 0.16;
          posY += (alvoY - posY) * 0.16;
          fogueira.style.transform = `translate(${posX}px, ${posY}px) translate(-50%, -100%)`;
          requestAnimationFrame(moverFogueira);
        }

        moverFogueira();
    </script>

</body>
</html>
